<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FOCUS AI — Orzular daftari</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060B">
<link rel="apple-touch-icon" href="assets/mnsm-logo.png?v=2">
<link rel="icon" type="image/png" href="assets/mnsm-logo.png?v=2">
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--void, #04060B); color: var(--text, #F5F2EC); }
  .phone { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--void, #04060B); padding: 26px 22px 48px; }
  h1 { font-size: 30px; margin: 6px 0 4px; }
  .sub { color: var(--text-dim, #9CA0A8); font-size: 15px; line-height: 1.5; margin-bottom: 18px; }
  .year { margin-top: 22px; }
  .year-hd { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 10px; }
  .year-hd .yr { font-size: 26px; font-weight: 800; color: var(--accent, #F4845F); font-family: 'Inter', sans-serif; letter-spacing: 1px; }
  .year-hd .cnt { font-size: 13px; color: var(--text-dim, #9CA0A8); }
  .addrow { display: flex; gap: 8px; margin-bottom: 4px; }
  .fld { flex: 1; padding: 13px; background: var(--card, #0C0F16); border: 1px solid var(--border-default, rgba(255,255,255,.12)); border-radius: 12px; color: var(--text, #F5F2EC); font-size: 16px; font-family: inherit; }
  .addbtn { flex-shrink: 0; width: 50px; border: none; border-radius: 12px; background: var(--accent, #F4845F); color: #fff; font-size: 24px; font-weight: 700; cursor: pointer; }
  .dream { display: flex; align-items: flex-start; gap: 12px; background: var(--card, #0C0F16); border: 1px solid var(--border-default, rgba(255,255,255,.12)); border-radius: 14px; padding: 13px 14px; margin-top: 9px; }
  .dream .ck { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--accent, #F4845F); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; padding: 0; margin-top: 1px; }
  .dream.done .ck { background: var(--accent, #F4845F); }
  .dream .tx { flex: 1; font-size: 16px; line-height: 1.4; word-break: break-word; }
  .dream.done .tx { text-decoration: line-through; color: var(--text-dim, #9CA0A8); }
  .dream .x { flex-shrink: 0; color: var(--text-dim, #9CA0A8); font-size: 22px; cursor: pointer; background: none; border: none; line-height: 1; }
  .empty { color: var(--text-dim, #9CA0A8); padding: 10px 4px; font-size: 15px; }
  /* Yangi orzu qo'shish kartasi + muddat */
  .add-card { background: var(--card, #0C0F16); border: 1px solid var(--border-default, rgba(255,255,255,.12)); border-radius: 16px; padding: 14px; margin-bottom: 8px; }
  .add-row2 { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .add-row2 .hint { flex: 1; font-size: 12px; color: var(--text-dim, #9CA0A8); }
  .cnt-hd { display: flex; align-items: baseline; gap: 10px; margin: 22px 2px 4px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim, #9CA0A8); }
  .cnt-hd .n { color: var(--accent, #F4845F); font-weight: 800; }
  .dream .ic-ed { flex-shrink: 0; color: var(--text-dim, #9CA0A8); font-size: 17px; cursor: pointer; background: none; border: none; line-height: 1; padding: 0 2px; }
  .dream.editing { flex-direction: column; align-items: stretch; }
  .mini { border: none; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .mini.save { background: var(--accent, #F4845F); color: #fff; }
  .mini.cancel, .mini.clr { background: transparent; border: 1px solid var(--border-default, rgba(255,255,255,.14)); color: var(--text-dim, #9CA0A8); }
  .remind { width: 100%; margin-top: 28px; padding: 15px; border-radius: 14px; border: 1px solid var(--accent, #F4845F); background: transparent; color: var(--accent, #F4845F); font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .remind.on { background: var(--accent, #F4845F); color: #fff; }
</style>
  <script>(function(){try{var t=localStorage.getItem('mvow.theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}})();</script>
</head>
<body>
<div class="phone">
  <h1 data-i18n="orzular.title">Orzular daftari</h1>
  <div class="sub" data-i18n="orzular.sub">Orzularingizni yozing va har biriga o'zingiz muddat belgilang. Ilova vaqti-vaqti bilan eslatib turadi.</div>

  <div class="add-card">
    <input class="fld" id="dreamText" maxlength="140" placeholder="Yangi orzu..." data-i18n-placeholder="orzular.add_ph" autocomplete="off">
    <div class="add-row2">
      <input class="fld" id="dreamDate" type="date" style="flex:0 0 158px;padding:9px 10px;font-size:14px;">
      <span class="hint" data-i18n="orzular.target_hint">🎯 muddat — ixtiyoriy</span>
      <button class="addbtn" id="dreamAdd" aria-label="qo'shish">+</button>
    </div>
  </div>

  <div class="cnt-hd"><span data-i18n="orzular.list_hd">Orzularim</span> <span class="n" id="cnt"></span></div>
  <div id="list"></div>

  <button id="remindBtn" class="remind" type="button">🔔 <span id="remindLbl" data-i18n="orzular.remind_off">Har kuni eslatib tur</span></button>
</div>

<script src="i18n.js?v=29.0.28"></script>
<script src="pin-lock.js?v=29.0.138"></script>
<script src="lang-switcher.js?v=29.0.28" defer></script>
<script src="data.js?v=29.0.28" defer></script>
<script src="social.js?v=29.0.28" defer></script>
<script src="supabase-config.js?v=29.0.28"></script>
<script src="push.js?v=29.0.28" defer></script>
<script src="nav-overlay.js?v=29.0.28" defer></script>
<script>
  (function () {
    var REMIND_ID = 'dream-reminder';
    var REMIND_TIME = '09:00';
    function T(k, fb) { return (window.I18N && I18N.t) ? I18N.t(k, fb) : fb; }
    function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]); }); }
    function load() { try { var d = JSON.parse(localStorage.getItem('mvow.dreams') || '[]'); return Array.isArray(d) ? d : []; } catch (e) { return []; } }
    function save(d) { try { localStorage.setItem('mvow.dreams', JSON.stringify(d)); } catch (e) {} }
    function fmtD(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? (m[3] + '.' + m[2] + '.' + m[1]) : ''; }
    function daysLeft(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return null; var t = new Date(+m[1], +m[2] - 1, +m[3]); t.setHours(0, 0, 0, 0); var n = new Date(); n.setHours(0, 0, 0, 0); return Math.round((t - n) / 86400000); }
    function targetHtml(iso) {
      var f = fmtD(iso); if (!f) return '';
      var dl = daysLeft(iso), tail = '';
      if (dl != null) { if (dl > 0) tail = ' · ' + dl + ' ' + T('orzular.days_left', 'kun qoldi'); else if (dl === 0) tail = ' · ' + T('orzular.today', 'bugun'); else tail = ' · ' + T('orzular.overdue', "muddat o'tdi"); }
      return '<div style="font-size:12px;color:var(--text-dim,#9CA0A8);margin-top:3px;">🎯 ' + f + ' ' + T('orzular.until', 'gacha') + tail + '</div>';
    }

    var listEl = document.getElementById('list');
    var cntEl = document.getElementById('cnt');
    var editingId = null;

    // Tartib: bajarilmagan avval (muddat yaqin — tepada, muddatsiz — oxirida); bajarilgan eng oxirida.
    function sortDreams(all) {
      return all.slice().sort(function (a, b) {
        if (!!a.done !== !!b.done) return a.done ? 1 : -1;
        var da = a.target ? daysLeft(a.target) : null, db = b.target ? daysLeft(b.target) : null;
        if (da == null) da = Infinity; if (db == null) db = Infinity;
        return da - db;
      });
    }
    function editRowHtml(d) {
      return '<div class="dream editing">'
        + '<input class="fld" id="editText" maxlength="140" value="' + esc(d.text) + '">'
        + '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;">'
        +   '<input class="fld" id="editDate" type="date" style="flex:0 0 158px;padding:9px 10px;font-size:14px;" value="' + (d.target || '') + '">'
        +   '<button class="mini clr" id="editClr" type="button">' + T('orzular.clear_date', 'muddatsiz') + '</button>'
        + '</div>'
        + '<div style="display:flex;gap:8px;margin-top:10px;">'
        +   '<button class="mini save" data-save="' + d.id + '">' + T('orzular.save', 'Saqlash') + '</button>'
        +   '<button class="mini cancel" data-cancel="1">' + T('orzular.cancel', 'Bekor') + '</button>'
        + '</div></div>';
    }
    function render() {
      var all = sortDreams(load());
      var done = all.filter(function (d) { return d.done; }).length;
      cntEl.textContent = all.length ? (done + '/' + all.length) : '';
      if (!all.length) { listEl.innerHTML = '<div class="empty">' + T('orzular.empty', "Hali orzu yo'q. Birinchisini yozing.") + '</div>'; return; }
      listEl.innerHTML = all.map(function (d) {
        if (editingId === d.id) return editRowHtml(d);
        return '<div class="dream ' + (d.done ? 'done' : '') + '">'
          + '<button class="ck" data-ck="' + d.id + '" aria-label="belgilash">' + (d.done ? '✓' : '') + '</button>'
          + '<div class="tx">' + esc(d.text) + (d.target ? targetHtml(d.target) : '') + '</div>'
          + '<button class="ic-ed" data-edit="' + d.id + '" aria-label="tahrirlash">✎</button>'
          + '<button class="x" data-del="' + d.id + '" aria-label="o\'chirish">×</button></div>';
      }).join('');
      wire();
    }
    function addDream(text, target) {
      text = (text || '').trim(); if (!text) return;
      var obj = { id: Date.now() + '' + Math.floor(Math.random() * 999), text: text, done: false };
      if (/^\d{4}-\d{2}-\d{2}$/.test(target || '')) obj.target = target;
      var d = load(); d.push(obj); save(d);
      if (window.MVOW_DATA && MVOW_DATA.fxSuccess) MVOW_DATA.fxSuccess();
      render();
    }
    function wire() {
      listEl.querySelectorAll('[data-ck]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.getAttribute('data-ck'), d = load();
          d.forEach(function (x) { if (String(x.id) === String(id)) x.done = !x.done; });
          save(d);
          if (window.MVOW_DATA && MVOW_DATA.fxTap) MVOW_DATA.fxTap();
          render();
        });
      });
      listEl.querySelectorAll('[data-del]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.getAttribute('data-del'), all = load();
          var item = all.filter(function (x) { return String(x.id) === String(id); })[0];
          save(all.filter(function (x) { return String(x.id) !== String(id); }));
          if (editingId === id) editingId = null;
          render();
          if (window.MvowUndo && item) MvowUndo.show(T('common.deleted', "O'chirildi"), function () { var a = load(); a.push(item); save(a); render(); });
        });
      });
      listEl.querySelectorAll('[data-edit]').forEach(function (b) {
        b.addEventListener('click', function () { editingId = b.getAttribute('data-edit'); render(); var t = document.getElementById('editText'); if (t) t.focus(); });
      });
      var saveBtn = listEl.querySelector('[data-save]');
      if (saveBtn) saveBtn.addEventListener('click', function () {
        var id = saveBtn.getAttribute('data-save');
        var tx = document.getElementById('editText'), dt = document.getElementById('editDate');
        var text = tx ? tx.value.trim() : '';
        if (!text) { if (tx) tx.focus(); return; }
        var target = (dt && /^\d{4}-\d{2}-\d{2}$/.test(dt.value)) ? dt.value : null;
        var d = load(); d.forEach(function (x) { if (String(x.id) === String(id)) { x.text = text; if (target) x.target = target; else delete x.target; } });
        save(d); editingId = null;
        if (window.MVOW_DATA && MVOW_DATA.fxSuccess) MVOW_DATA.fxSuccess();
        render();
      });
      var cancelBtn = listEl.querySelector('[data-cancel]');
      if (cancelBtn) cancelBtn.addEventListener('click', function () { editingId = null; render(); });
      var clrBtn = document.getElementById('editClr');
      if (clrBtn) clrBtn.addEventListener('click', function () { var dt = document.getElementById('editDate'); if (dt) dt.value = ''; });
    }

    // Yangi orzu qo'shish (yuqoridagi doimiy karta)
    var addBtn = document.getElementById('dreamAdd'), addText = document.getElementById('dreamText'), addDate = document.getElementById('dreamDate');
    function doAdd() { addDream(addText.value, addDate.value); addText.value = ''; addDate.value = ''; addText.focus(); }
    if (addBtn) addBtn.addEventListener('click', doAdd);
    if (addText) addText.addEventListener('keydown', function (e) { if (e.key === 'Enter') doAdd(); });

    // ── Vaqti-vaqti bilan eslatib tur (Web Push — ilova yopiq bo'lsa ham) ──
    function reminders() { try { var r = JSON.parse(localStorage.getItem('mvow.reminders') || '[]'); return Array.isArray(r) ? r : []; } catch (e) { return []; } }
    function saveReminders(r) { try { localStorage.setItem('mvow.reminders', JSON.stringify(r)); } catch (e) {} if (window.PushReminders && PushReminders.isEnabled()) PushReminders.sync(); }
    function remindOn() { return reminders().some(function (x) { return x.id === REMIND_ID; }); }
    var remindBtn = document.getElementById('remindBtn'), remindLbl = document.getElementById('remindLbl');
    function syncRemindBtn() {
      var on = remindOn();
      remindBtn.classList.toggle('on', on);
      remindLbl.textContent = on ? T('orzular.remind_on', 'Eslatib turiladi ✓') : T('orzular.remind_off', 'Har kuni eslatib tur');
    }
    remindBtn.addEventListener('click', function () {
      var r = reminders();
      if (remindOn()) {
        saveReminders(r.filter(function (x) { return x.id !== REMIND_ID; }));
        syncRemindBtn();
      } else {
        r.push({ id: REMIND_ID, time: REMIND_TIME, text: '📖 ' + T('orzular.remind_card', 'orzularingizni o\'qing') });
        saveReminders(r);
        syncRemindBtn();
        if (window.PushReminders) PushReminders.enable().then(function (res) {
          if (!(res && res.ok)) alert(T('orzular.push_denied', "Eslatma saqlandi. Telefon bildirishnomasi uchun ruxsat bering."));
        });
      }
    });

    render();
    syncRemindBtn();
  })();
</script>
<script src="undo-toast.js?v=29.0.51"></script>
<script src="reveal.js?v=29.0.71" defer></script>
  <script src="motion-fx.js?v=29.0.118" defer></script>
<script src="back-btn.js?v=29.0.133"></script>
</body>
</html>
